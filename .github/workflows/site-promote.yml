name: Promote verified site candidate (manual)
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful manual site build run ID
        required: true
        type: string
      source_sha:
        description: Exact source commit recorded in candidate provenance
        required: true
        type: string
      artifact_sha256:
        description: SHA256 of the original artifact.tar from the build summary
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-site-publication
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Check original run identity before downloading
        run: python3 .github/automation/site_artifact.py check-run
      - uses: actions/download-artifact@v4
        with:
          name: site-candidate
          path: candidate
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify original bytes and provenance
        run: python3 .github/automation/site_artifact.py verify
      - name: Promote original site into existing docs source
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil, tarfile
          target=Path('docs')
          if target.exists(): shutil.rmtree(target)
          target.mkdir()
          with tarfile.open('candidate/artifact.tar') as tar:
              tar.extractall(target, filter='data')
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "site: promote verified source ${SOURCE_SHA}"
          git push origin HEAD:main
