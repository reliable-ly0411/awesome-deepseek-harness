name: Automation policy safety checks
on:
  push:
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - run: python -m unittest discover -s .github/automation -p 'test_*.py'
